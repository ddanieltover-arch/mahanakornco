name: SEO Validation

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "scripts/seo/**"
      - ".github/workflows/seo-check.yml"

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: SEO file audit
        run: node scripts/seo/seo-audit.mjs

      - name: Validate schema templates
        run: node scripts/seo/validate-schema.mjs

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://mahanakornco.com/
            https://mahanakornco.com/products
            https://mahanakornco.com/faq
          configPath: .lighthouserc.json
          uploadArtifacts: true
        continue-on-error: true
